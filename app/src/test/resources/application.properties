# Tests run against SQLite too, not H2: the booking concurrency behaviour we rely on
# (week 2) is dialect-specific, so an embedded stand-in would test the wrong database.
# Shared-cache in-memory means every pooled connection sees the same schema.
spring.datasource.url=jdbc:sqlite:file:testdb?mode=memory&cache=shared
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.datasource.hikari.maximum-pool-size=1

spring.jpa.hibernate.ddl-auto=create-drop
spring.sql.init.mode=never
