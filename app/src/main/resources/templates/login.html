<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Log in — Jamuna Hostel cycles</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<main class="login">
    <h1>Jamuna Hostel cycles</h1>

    <p class="error" th:if="${param.error}">That smail address and passcode did not match.</p>
    <p class="notice" th:if="${param.logout}">Logged out.</p>

    <form th:action="@{/login}" method="post">
        <label for="username">Smail address</label>
        <input type="email" id="username" name="username" autocomplete="username"
               placeholder="ce24b128@smail.iitm.ac.in" required autofocus>

        <label for="password">Passcode</label>
        <input type="password" id="password" name="password" autocomplete="current-password" required>

        <button type="submit">Log in</button>
    </form>
</main>
</body>
</html>
