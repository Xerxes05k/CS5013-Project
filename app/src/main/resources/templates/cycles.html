<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cycles — Jamuna Hostel</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div th:replace="~{fragments/layout :: topbar}"></div>
<nav th:replace="~{fragments/layout :: tabs('cycles')}"></nav>
<header>
    <h1>Jamuna Hostel cycles</h1>
    <p class="summary">
        <span th:text="${availableCount}">0</span> of
        <span th:text="${#lists.size(cycles)}">0</span> free right now
    </p>
</header>

<main>
    <p class="notice" th:if="${notice}" th:text="${notice}">Booked.</p>
    <p class="error" th:if="${error}" th:text="${error}">Not booked.</p>
    <!-- One card per cycle. The chip says the state in words as well as colour
         (docs/UI.md §3), so it still reads in sunlight or for colour-blind residents. -->
    <ul class="cards">
        <li th:each="cycle : ${cycles}" class="card"
            th:with="mine=${rental != null and rental.cycleLabel == cycle.label}"
            th:classappend="${mine} ? 'mine'">
            <div class="card-head">
                <span class="label" th:text="${cycle.label}">JAM-01</span>
                <span class="chip" th:classappend="'chip-' + ${cycle.state}" th:switch="${cycle.state.name()}">
                    <span th:case="'AVAILABLE'">Free</span>
                    <span th:case="'BOOKED'">Booked</span>
                    <span th:case="'ISSUED'">In use</span>
                    <span th:case="'UNDER_REPAIR'">Under repair</span>
                </span>
            </div>
            <div class="card-foot">
                <span class="card-note" th:if="${mine}">Your cycle</span>
                <span class="card-note" th:unless="${mine}" th:switch="${cycle.state.name()}">
                    <span th:case="'AVAILABLE'">Ready to book</span>
                    <span th:case="'BOOKED'">Reserved, waiting for pickup</span>
                    <span th:case="'ISSUED'">Out with a resident</span>
                    <span th:case="'UNDER_REPAIR'">Being repaired, can't be booked</span>
                </span>
                <a th:if="${cycle.bookable() and rental == null}" class="book"
                   th:href="@{/cycles/{id}/verify(id=${cycle.id})}">Book</a>
                <a th:if="${mine}" class="book" th:href="@{/rental}">Open</a>
            </div>
        </li>
    </ul>
    <p class="empty" th:if="${#lists.isEmpty(cycles)}">No cycles registered yet.</p>
</main>

</body>
</html>
