<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<!-- Shared page chrome. Each page includes these with th:replace, so the tabs and the
     log-out button are written once. See docs/UI.md §1. -->

<div th:fragment="topbar" class="topbar">
    <span>Jamuna cycles</span>
    <form th:action="@{/logout}" method="post">
        <button type="submit">Log out</button>
    </form>
</div>

<!-- active: which tab to highlight, "cycles", "rental", "history" or "report".
     hasOpenRental comes from NavigationAdvice on every page. -->
<nav th:fragment="tabs(active)" class="tabs" aria-label="Sections">
    <a class="tab" th:classappend="${active == 'cycles'} ? 'active'" th:href="@{/cycles}"
       th:aria-current="${active == 'cycles'} ? 'page'">Cycles</a>
    <a class="tab" th:classappend="${active == 'rental'} ? 'active'" th:href="@{/rental}"
       th:aria-current="${active == 'rental'} ? 'page'">My cycle<span class="tab-dot" th:if="${hasOpenRental}"></span><span
            class="sr-only" th:if="${hasOpenRental}"> (you have a cycle)</span></a>
    <a class="tab" th:classappend="${active == 'history'} ? 'active'" th:href="@{/history}"
       th:aria-current="${active == 'history'} ? 'page'">History</a>
    <a class="tab" th:classappend="${active == 'report'} ? 'active'" th:href="@{/report}"
       th:aria-current="${active == 'report'} ? 'page'">Report</a>
</nav>

<!-- sub: which part of the Report tab is showing, "usage" or "maintenance". -->
<nav th:fragment="subtabs(sub)" class="subtabs" aria-label="Report sections">
    <a class="subtab" th:classappend="${sub == 'usage'} ? 'active'" th:href="@{/report}">Usage</a>
    <a class="subtab" th:classappend="${sub == 'maintenance'} ? 'active'" th:href="@{/report/maintenance}">Maintenance</a>
</nav>

<!-- After a pickup or return succeeds. The guard has no device and reads this off the
     resident's phone, so it is big and says what the guard should do (docs/UI.md §2).
     confirmed is a RentalController.GuardConfirmation flash attribute. -->
<div th:fragment="confirmed" class="confirmed" th:if="${confirmed}" role="status">
    <p class="confirmed-title">&#10003; <span th:text="${confirmed.title}">Pickup confirmed</span></p>
    <p class="confirmed-cycle" th:text="${confirmed.cycleLabel}">JAM-04</p>
    <p th:text="${confirmed.detail}">Guard: hand over the cycle.</p>
</div>

</body>
</html>
