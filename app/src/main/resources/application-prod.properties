# The live server (ADR 0006). Turned on with --spring.profiles.active=prod; everything
# not set here comes from application.properties.

# The database lives outside the app folder, so replacing the jar on a redeploy never
# touches it. systemd creates /var/lib/cyclebooking (deploy/cyclebooking.service).
spring.datasource.url=jdbc:sqlite:${CYCLEBOOKING_DB:/var/lib/cyclebooking/cyclebooking.db}

# No seed data: data.sql carries the dev login with a passcode published in the repo.
# Residents come from the resident importer (docs/DEPLOY.md), cycles from one SQL line each.
spring.sql.init.mode=never

# Only Caddy, on the same machine, talks to the app. Caddy serves HTTPS to the phones and
# passes X-Forwarded-* headers, which Spring trusts so redirects stay on https.
server.address=127.0.0.1
server.forward-headers-strategy=native

# The login session cookie is only ever sent over HTTPS.
server.servlet.session.cookie.secure=true

# Ubuntu's tesseract-ocr package puts the English data here.
cyclebooking.ocr.tessdata=/usr/share/tesseract-ocr/5/tessdata

# Who gets the GS role on the live site. From the service file (CYCLEBOOKING_GS), never
# the dev default in application.properties: that names a resident who is not the GS.
# Unset means nobody is GS, so the Report tab is hidden from everyone.
cyclebooking.gs-smails=${CYCLEBOOKING_GS:}
