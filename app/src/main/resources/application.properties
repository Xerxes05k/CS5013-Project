spring.application.name=cyclebooking

# SQLite, one file on disk (ADR 0002). The directory is gitignored.
spring.datasource.url=jdbc:sqlite:data/cyclebooking.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect

# SQLite serialises writes; a single connection avoids SQLITE_BUSY under concurrent
# booking attempts. Revisit in week 2 when the booking concurrency test lands.
spring.datasource.hikari.maximum-pool-size=1

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Seed cycles and a demo resident on an empty database.
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true
